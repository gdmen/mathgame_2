# The public front door: TLS termination, host canonicalization, the static
# web bundle, and the API proxy. Synced to /etc/nginx/conf.d/ by
# deploy/update.sh; rationale and contract in docs/ops-runbook.md ("The front
# door").

# Keep the nginx version out of the Server header on every vhost below.
server_tokens off;

server {
    listen 80;
    server_name mikeymath.org www.mikeymath.org;

    # Certbot webroot renewals; must bypass the redirect below.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://mikeymath.org$request_uri;
    }
}

server {
    # The 1.25+ `http2` directive doesn't exist on the prod host's nginx 1.18.
    listen 443 ssl http2;
    server_name www.mikeymath.org;

    ssl_certificate     /etc/letsencrypt/live/mikeymath.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mikeymath.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://mikeymath.org$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mikeymath.org;

    ssl_certificate     /etc/letsencrypt/live/mikeymath.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mikeymath.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers, on every response. nginx drops all inherited add_header
    # directives in any location that sets its own, so this set is repeated in
    # the /static/ and @maintenance locations below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The published copy, not the repo's web/build: www-data must not need
    # traversal into /home/ubuntu, where conf.json lives.
    root /var/www/mathgame/build;
    index index.html;

    gzip on;
    # Both .js mappings: nginx <1.21.5 (prod's 1.18) says application/javascript,
    # newer says text/javascript.
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_comp_level 6;
    gzip_vary on;

    # The deploy window; update.sh owns the flag's lifecycle.
    if (-f /var/www/mathgame/maintenance.on) {
        return 503;
    }
    # A named location skips the server-level ifs on the internal redirect,
    # so the flag cannot re-trip 503 while serving the page itself.
    error_page 503 @maintenance;

    location @maintenance {
        root /var/www/mathgame;
        try_files /maintenance.html =503;
        # `always`: a bare add_header applies to success statuses only.
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store" always;
        # Re-declared: this location's own add_header drops the server-level set.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Unknown paths: 404 with the shell as the body (docs/ops-runbook.md, The
    # front door); 403 folded in so a bare directory URL answers the same.
    error_page 403 404 =404 /app.html;

    # The API: apiserver on loopback plain HTTP; `^~` keeps /api/ out of the
    # regex locations below.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The synchronous last-resort WORD generation can legitimately run
        # for minutes; the 60s default would 504 it mid-generation.
        proxy_read_timeout 300s;
    }

    # The React shell's route list; docs/ops-runbook.md owns the extension
    # procedure and server/api/web_routes_sync_test.go enforces parity with
    # the Switch in web/src/index.js. Non-strict and case-insensitive to
    # keep old /play/-style links working.
    location ~* ^/(login|play|settings|progress|admin)/?$ {
        try_files /app.html =404;
    }
    location ~* ^/(pin|admin)/ {
        try_files /app.html =404;
    }

    # Everything unhashed revalidates every load: heuristic caching of the
    # shell would have it request hashed bundles the deploy swap already
    # deleted. Set at server level so try_files-served app.html inherits it;
    # `always` so the error_page-served shell (a 404) carries it too.
    add_header Cache-Control "no-cache" always;

    # CRA content-hashes everything under /static; its own add_header
    # replaces the inherited no-cache.
    location ^~ /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Re-declared: this location's own add_header drops the server-level set.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
