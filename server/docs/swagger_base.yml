# Merged into the scanned spec by `make build-docs`. Nested YAML cannot live in
# the swagger:meta doc comment; see docs/swagger.md.
securityDefinitions:
  bearer:
    type: apiKey
    name: Authorization
    in: header
    description: Auth0-issued JWT, sent as `Bearer <token>`.
security:
  - bearer: []
# The one primitive-bodied response; see docs/swagger.md.
responses:
  swaggerSpecResp:
    description: The Swagger 2.0 document, as YAML.
    schema:
      type: string
