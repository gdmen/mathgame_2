name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:

  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'

    - name: Set up MySQL
      run: |
        sudo /etc/init.d/mysql start
        mysql -e 'CREATE DATABASE mathgame_test;' -u root -proot

    - name: Clean
      run: make clean

    - name: Build
      run: make build-api

    # The jest job and build-web read the committed copy without regenerating
    # it, so a stale one ships. Build regenerates before the tests read it,
    # which is why they cannot catch this themselves.
    - name: Generated frontend enums up to date
      run: git diff --exit-code web/src/enums.generated.js

    - name: Test
      run: make test-api test-cmds

    # Default symbol scan: exits nonzero only when our code actually calls a
    # vulnerable symbol, so modules we merely require don't gate the build.
    - name: Vulnerability scan
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  web_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web/package-lock.json

    # Identical to running `make test-web` locally: the target installs the node
    # deps and runs the suite, so there is one set of flags for both.
    - name: Test
      run: make test-web

    # --omit=dev scopes the gate to what ships to browsers; the accepted
    # dev-tree risk is recorded in docs/ops-runbook.md.
    - name: Vulnerability scan
      run: cd web && npm audit --omit=dev --audit-level=moderate
