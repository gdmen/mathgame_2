name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:

  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Set up Go
      uses: actions/setup-go@v2
      with:
        go-version: 1.24.2

    - name: Set up MySQL
      run: |
        sudo /etc/init.d/mysql start
        mysql -e 'CREATE DATABASE mathgame_test;' -u root -proot

    - name: Clean
      run: make clean

    - name: Build
      run: make build-api

    - name: Test
      run: make test-api

  web_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v7
      with:
        node-version: 18
        cache: npm
        cache-dependency-path: web/package-lock.json

    # Identical to running `make test-web` locally: the target installs the node
    # deps and runs the suite, so there is one set of flags for both.
    - name: Test
      run: make test-web
